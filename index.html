<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Optimal Minecraft</title>
  <meta name="description" content="Minecraft tools: farms, tricks, villager trades and a horse calculator." />
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #1a1410; color: #f4ead5; }
    body {
      font-family: "Pixelify Sans", system-ui, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px),
        radial-gradient(ellipse at top, rgba(74,100,40,0.15), transparent 60%);
      background-size: 16px 16px, 16px 16px, 100% 100%;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
    h1 { margin: 0 0 20px; text-align: center; font-weight: 600; font-size: 28px; letter-spacing: 2px; line-height: 1.2; color: #7cc242; text-shadow: 3px 3px 0 #0a0805; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .sec { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; aspect-ratio: 1; text-decoration: none; color: #f4ead5;
      background: #2a221c; border: 2px solid #0a0805;
      box-shadow: inset 2px 2px 0 rgba(255,255,255,0.06), inset -2px -2px 0 rgba(0,0,0,0.5), 4px 4px 0 rgba(0,0,0,0.4); }
    .sec:hover, .sec:focus-visible { border-color: #ffd54a; outline: none; }
    .sec:active { transform: translate(1px, 1px); }
    .sec img { width: 64px; height: 64px; image-rendering: pixelated; }
    .sec span { font-size: 20px; letter-spacing: 1px; }
    @media (min-width: 700px) {
      .wrap { padding-top: 48px; }
      h1 { font-size: 36px; margin-bottom: 32px; }
      .grid { grid-template-columns: repeat(auto-fit, 200px); justify-content: center; gap: 14px; }
      .sec img { width: 80px; height: 80px; }
      .sec span { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Optimal Minecraft</h1>
    <nav class="grid" id="grid"></nav>
  </div>
<script>
// One entry per section. Add a new section here.
const SECTIONS = [
  { name: 'Farms', href: 'farms/', icon: 'farms/icons/iron_ingot.png' },
  { name: 'Horses', href: 'horses/', icon: 'farms/icons/saddle.png' },
];
document.getElementById('grid').innerHTML = SECTIONS.map(s =>
  `<a class="sec" href="${s.href}"><img src="${s.icon}" alt=""><span>${s.name}</span></a>`).join('');
</script>
</body>
</html>
